<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电视壁纸 · 远程导入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    background: #0b1017; color: #e8eef6;
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #8fa0b3; font-size: 13px; margin-bottom: 22px; }
  .card { background: #131b26; border: 1px solid #1e2a3a; border-radius: 14px; padding: 18px; }
  .drop {
    border: 2px dashed #2d4059; border-radius: 14px; padding: 30px 20px;
    text-align: center; cursor: pointer; transition: .15s;
  }
  .drop.hover, .drop:focus { border-color: #4c8dff; background: #14202f; outline: none; }
  .drop b { color: #4c8dff; }
  .drop small { display: block; color: #7f8fa3; margin-top: 6px; }
  #progress { margin-top: 14px; display: none; }
  #progress .phead { font-size: 13px; color: #dbe6f2; }
  #progress .plist { max-height: 132px; overflow-y: auto; overscroll-behavior: contain; margin-top: 2px; padding-right: 4px; }
  .prow { margin-top: 8px; font-size: 13px; color: #a8b8c9; }
  .prow .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: #1b2735; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: #4c8dff; transition: width .15s; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
  .head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .head span { color: #7f8fa3; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; }
  .pager button { flex: 0 0 auto; padding: 8px 20px; border-radius: 999px; }
  .pager .pinfo { font-size: 13px; color: #8fa0b3; }
  .item { background: #131b26; border: 1px solid #1e2a3a; border-radius: 12px; overflow: hidden; }
  .item.cur { border-color: #4c8dff; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #0f1620; }
  .meta { padding: 10px 12px 12px; }
  .name { font-size: 13px; word-break: break-all; color: #dbe6f2; }
  .size { font-size: 12px; color: #7f8fa3; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #1d4ed8; color: #fff; margin-left: 6px; }
  .ops { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid #2b3a4d; background: #1a2533; color: #dbe6f2; cursor: pointer;
  }
  button:hover { background: #223044; }
  button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  button:disabled, button:disabled:hover {
    background: #141c27; border-color: #202d3c; color: #5d6c7e;
    cursor: default; opacity: .85;
  }
  button.danger:hover { background: #4a1d24; border-color: #7a2a35; color: #ff9aa6; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1d4ed8; color: #fff; padding: 9px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { color: #7f8fa3; padding: 26px 0; text-align: center; }
  .types { display: flex; gap: 8px; margin: 0 0 16px; }
  .types button { flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; }
  .types button.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>电视壁纸 · 远程导入</h1>
  <div class="sub">同一局域网下打开本页即可上传 / 切换 / 删除壁纸。上传后需要手动「设为当前」才会换画面。</div>

  <div class="types">
    <button type="button" id="tabImage" class="on">静态壁纸（图片）</button>
    <button type="button" id="tabVideo">动态壁纸（视频）</button>
  </div>

  <div class="card">
    <div class="drop" id="drop" tabindex="0">
      <span id="dropTitle">点击选择图片，或把文件拖到这里</span><br>
      <b id="dropFormats">支持多张 JPG / PNG / WebP</b>
      <small id="dropHint">图片会直接存进电视本机，并在电视上参与 4K 静态壁纸管线</small>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <input type="file" id="folder" webkitdirectory directory multiple hidden>
    <button type="button" id="pickFolder" style="width:100%;margin-top:12px;">
      选择文件夹批量导入（自动遍历子目录，不保留目录结构）
    </button>
    <div id="progress"></div>
  </div>

  <div class="head">
    <h2 id="listTitle">已有静态壁纸</h2>
    <span id="summary">加载中…</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
  <div class="empty" id="empty" style="display:none">还没有壁纸</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var summary = document.getElementById('summary');
  var empty = document.getElementById('empty');
  var drop = document.getElementById('drop');
  var input = document.getElementById('file');
  var folderInput = document.getElementById('folder');
  var pickFolder = document.getElementById('pickFolder');
  var prog = document.getElementById('progress');
  var pager = document.getElementById('pager');
  var PAGE_SIZE = 24;
  var page = 0;
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var tabImage = document.getElementById('tabImage');
  var tabVideo = document.getElementById('tabVideo');
  var dropTitle = document.getElementById('dropTitle');
  var dropFormats = document.getElementById('dropFormats');
  var dropHint = document.getElementById('dropHint');
  var listTitle = document.getElementById('listTitle');
  var curType = 'image';
  var lastData = { items: [] };

  function isVideoName(name) {
    return /\.(mp4|mkv|webm|mov|m4v|ts)$/i.test(name || '');
  }

  function typeLabel(type) {
    return type === 'video' ? '动态壁纸' : '静态壁纸';
  }

  function setType(type) {
    curType = type;
    page = 0;
    var video = type === 'video';
    tabImage.className = video ? '' : 'on';
    tabVideo.className = video ? 'on' : '';
    input.accept = video ? 'video/mp4,video/x-matroska,video/webm,video/quicktime,.mp4,.mkv,.webm,.mov,.m4v' : 'image/*';
    folderInput.accept = input.accept;
    dropTitle.textContent = video ? '点击选择视频，或把文件拖到这里'
      : '点击选择图片，或把文件拖到这里';
    dropFormats.textContent = video ? '支持 MP4 / MKV / WebM / MOV，单个文件最大 600 MB'
      : '支持多张 JPG / PNG / WebP';
    dropHint.textContent = video ? '视频会存进电视本机，选中后循环播放作为动态壁纸'
      : '图片会直接存进电视本机，并在电视上参与 4K 静态壁纸管线';
    listTitle.textContent = '已有' + typeLabel(type);
    render(lastData);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function fmtSize(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    if (n > 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  function api(path, opts) {
    return fetch(path, opts || {}).then(function (r) {
      return r.json().catch(function () { return { ok: false }; });
    });
  }

  function render(data) {
    lastData = data || { items: [] };
    var all = lastData.items || [];
    var items = all.filter(function (it) {
      return (it.type === 'video' ? 'video' : 'image') === curType;
    });
    var current = curType === 'video' ? lastData.currentVideo : lastData.current;
    var pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (page > pages - 1) page = pages - 1;
    if (page < 0) page = 0;
    var start = page * PAGE_SIZE;
    var pageItems = items.slice(start, start + PAGE_SIZE);
    summary.textContent = items.length + (curType === 'video' ? ' 个视频' : ' 张') +
      (pages > 1 ? ' · 第 ' + (page + 1) + '/' + pages + ' 页' : '') +
      (current ? ' · 当前：' + current : '');
    empty.textContent = curType === 'video' ? '还没有动态壁纸' : '还没有静态壁纸';
    empty.style.display = items.length ? 'none' : 'block';
    grid.innerHTML = '';
    pageItems.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'item' + (it.current ? ' cur' : '');

      var img = document.createElement('img');
      img.className = 'thumb';
      img.loading = 'lazy';
      var tq = '&type=' + curType;
      img.src = '/api/thumb?name=' + encodeURIComponent(it.name) + tq;
      card.appendChild(img);

      var meta = document.createElement('div');
      meta.className = 'meta';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.name;
      if (it.current) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '当前';
        name.appendChild(badge);
      }
      meta.appendChild(name);

      var size = document.createElement('div');
      size.className = 'size';
      size.textContent = fmtSize(it.size) + (curType === 'video' ? ' · 循环播放' : '');
      meta.appendChild(size);

      var ops = document.createElement('div');
      ops.className = 'ops';

      var applyBtn = document.createElement('button');
      applyBtn.className = it.current ? 'ghost' : 'primary';
      applyBtn.textContent = it.current ? '当前壁纸' : '设为当前';
      applyBtn.disabled = it.current;
      if (it.current) {
        applyBtn.title = '已经是当前壁纸';
      }
      applyBtn.onclick = function () {
        applyBtn.disabled = true;
        api('/api/apply?name=' + encodeURIComponent(it.name) + tq, { method: 'POST' })
          .then(function (r) {
            if (r.ok) { toast('已切换为 ' + it.name); refresh(); }
            else { toast('切换失败'); applyBtn.disabled = false; }
          });
      };
      ops.appendChild(applyBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = '删除';
      delBtn.onclick = function () {
        var msg = '删除' + typeLabel(curType) + '「' + it.name + '」？';
        if (it.current) msg = '这是当前壁纸，删除后桌面会置黑，直到重新设置壁纸，继续？';
        if (!confirm(msg)) return;
        delBtn.disabled = true;
        api('/api/delete?name=' + encodeURIComponent(it.name) + tq, { method: 'POST' })
          .then(function (r) {
            if (r.ok) { toast('已删除'); refresh(); }
            else { toast(r.error || '删除失败'); delBtn.disabled = false; }
          });
      };
      ops.appendChild(delBtn);

      meta.appendChild(ops);
      card.appendChild(meta);
      grid.appendChild(card);
    });
    renderPager(pages);
  }

  function renderPager(pages) {
    pager.innerHTML = '';
    if (pages <= 1) return;
    function makeBtn(label, target, disabled) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      btn.disabled = disabled;
      btn.onclick = function () {
        page = target;
        render(lastData);
        document.getElementById('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      return btn;
    }
    pager.appendChild(makeBtn('上一页', page - 1, page === 0));
    var info = document.createElement('span');
    info.className = 'pinfo';
    info.textContent = (page + 1) + ' / ' + pages;
    pager.appendChild(info);
    pager.appendChild(makeBtn('下一页', page + 1, page === pages - 1));
  }

  function refresh() {
    api('/api/list').then(render).catch(function () {
      summary.textContent = '连接断开';
    });
  }

  function uploadOne(file, index, total, host) {
    return new Promise(function (resolve) {
      var row = document.createElement('div');
      row.className = 'prow';
      var label = document.createElement('div');
      label.className = 'pname';
      label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · 0%';
      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      bar.appendChild(fill);
      row.appendChild(label);
      row.appendChild(bar);
      host.appendChild(row);
      host.scrollTop = host.scrollHeight;

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name)
        + '&type=' + curType);
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round(e.loaded / e.total * 100);
        label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · ' + pct + '%';
        fill.style.width = pct + '%';
      };
      xhr.onload = function () {
        var ok = false, msg = '上传失败', dup = false;
        try {
          var r = JSON.parse(xhr.responseText);
          ok = !!r.ok;
          dup = !!r.duplicate;
          if (ok) msg = dup ? '已存在，已忽略' : '已上传 ' + r.name;
          else msg = r.error || msg;
        } catch (e) { }
        label.textContent = (ok ? (dup ? '= ' : '✓ ') : '✗ ') + file.name
          + (dup ? ' · ' + msg : (ok ? '' : ' · ' + msg));
        fill.style.width = '100%';
        fill.style.background = ok ? '#22c55e' : '#ef4444';
        resolve(dup ? 'dup' : (ok ? 'ok' : 'fail'));
      };
      xhr.onerror = function () {
        label.textContent = '✗ ' + file.name + ' · 网络错误';
        fill.style.background = '#ef4444';
        resolve('fail');
      };
      xhr.send(file);
    });
  }

  function uploadFiles(files) {
    var video = curType === 'video';
    var list = Array.prototype.filter.call(files, function (f) {
      if (video) {
        return /^video\//.test(f.type) || isVideoName(f.name);
      }
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name || '');
    });
    if (!list.length) { toast(video ? '请选择视频文件' : '请选择图片文件'); return; }
    prog.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'phead';
    var listEl = document.createElement('div');
    listEl.className = 'plist';
    prog.appendChild(head);
    prog.appendChild(listEl);
    prog.style.display = 'block';
    var okCount = 0, dupCount = 0, failCount = 0, doneCount = 0;
    var total = list.length;
    function summaryText(done) {
      var s = '导入中 ' + done + '/' + total + ' · 成功 ' + okCount;
      if (dupCount) s += ' · 已存在 ' + dupCount;
      if (failCount) s += ' · 失败 ' + failCount;
      return s;
    }
    head.textContent = summaryText(0);
    var chain = Promise.resolve();
    list.forEach(function (f, i) {
      chain = chain.then(function () {
        return uploadOne(f, i, total, listEl).then(function (st) {
          if (st === 'ok') okCount++;
          else if (st === 'dup') dupCount++;
          else failCount++;
          doneCount++;
          head.textContent = summaryText(doneCount);
        });
      });
    });
    chain.then(function () {
      var msg = '完成：导入 ' + okCount + ' 个';
      if (dupCount) msg += '，已存在忽略 ' + dupCount + ' 个';
      if (failCount) msg += '，失败 ' + failCount + ' 个';
      head.textContent = msg;
      toast(msg);
      setTimeout(function () { prog.innerHTML = ''; prog.style.display = 'none'; }, 4000);
      refresh();
    });
  }

  drop.addEventListener('click', function () { input.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', function () {
    if (input.files && input.files.length) uploadFiles(input.files);
    input.value = '';
  });
  pickFolder.addEventListener('click', function () { folderInput.click(); });
  folderInput.addEventListener('change', function () {
    if (folderInput.files && folderInput.files.length) uploadFiles(folderInput.files);
    folderInput.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('hover'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('hover'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });

  tabImage.addEventListener('click', function () { setType('image'); });
  tabVideo.addEventListener('click', function () { setType('video'); });
  setType('image');
  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
