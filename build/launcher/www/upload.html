<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电视壁纸 · 远程导入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    background: #0b1017; color: #e8eef6;
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: none; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #8fa0b3; font-size: 13px; margin-bottom: 22px; }
  .card { background: #131b26; border: 1px solid #1e2a3a; border-radius: 14px; padding: 18px; }
  .drop {
    border: 2px dashed #2d4059; border-radius: 14px; padding: 30px 20px;
    text-align: center; cursor: pointer; transition: .15s;
  }
  .drop.hover, .drop:focus { border-color: #4c8dff; background: #14202f; outline: none; }
  .drop b { color: #4c8dff; }
  .drop small { display: block; color: #7f8fa3; margin-top: 6px; }
  #progress { margin-top: 14px; display: none; }
  #progress .phead { font-size: 13px; color: #dbe6f2; }
  #progress .plist { max-height: 132px; overflow-y: auto; overscroll-behavior: contain; margin-top: 2px; padding-right: 4px; }
  .prow { margin-top: 8px; font-size: 13px; color: #a8b8c9; }
  .prow .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: #1b2735; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: #4c8dff; transition: width .15s; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
  .head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .head span { color: #7f8fa3; font-size: 13px; }
  /* 卡片固定 250px 宽，列数随窗口自适应；行数由脚本按窗口高度计算 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 250px); justify-content: start; gap: 20px; }
  .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; }
  .pager button { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; min-width: 42px; }
  .pager button.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .pager .pinfo { font-size: 13px; color: #8fa0b3; padding: 0 4px; }
  /* 分页器下方的状态栏：壁纸统计 + 存储空间 */
  .statusbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
    gap: 4px 20px; margin-top: 16px; padding-top: 12px;
    border-top: 1px solid #1e2a3a; color: #dbe6f2; font-size: 12px;
  }
  .statusbar span { white-space: nowrap; }
  .statusbar em { font-style: normal; color: #6f7f92; margin-right: 6px; }
  .statusbar b { font-weight: 600; }
  .meta { padding: 8px 10px 10px; }
  /* 「设为当前」「删除」水平排列 */
  .ops { flex-direction: row; gap: 8px; }
  .ops button { padding: 7px 8px; font-size: 12px; }
  /* 手机上：两列自适应、间距收紧、按钮加大触摸区域；分页交给连续滚动 */
  @media (max-width: 640px) {
    body { padding: 16px 14px 40px; }
    h1 { font-size: 19px; }
    .sub { margin-bottom: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .ops { gap: 6px; }
    .ops button { padding: 10px 6px; }
    .pager { margin-top: 12px; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: 1fr; }
  }
  /* 上传区：左侧按文件、右侧按文件夹 */
  .drops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drops .drop { padding: 26px 16px; }
  @media (max-width: 640px) { .drops { grid-template-columns: 1fr; } }
  .item { background: #131b26; border: 1px solid #1e2a3a; border-radius: 12px; overflow: hidden; }
  .item.cur { border-color: #4c8dff; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #0f1620; }
  .thumbWrap { position: relative; }
  /* 文件名 + 大小浮在图片底部：渐变底 + 单行省略，字号沿用原来的大小 */
  .thumbWrap .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 8px 6px;
    background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
  }
  .thumbWrap .name {
    color: #fff; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    word-break: normal;
  }
  .thumbWrap .size { color: rgba(255,255,255,.72); font-size: 12px; margin-top: 1px; }
  .meta { padding: 10px 12px 12px; }
  .name { font-size: 13px; word-break: break-all; color: #dbe6f2; }
  .size { font-size: 12px; color: #7f8fa3; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #1d4ed8; color: #fff; margin-left: 6px; }
  .ops { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid #2b3a4d; background: #1a2533; color: #dbe6f2; cursor: pointer;
  }
  button:hover { background: #223044; }
  button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  button:disabled, button:disabled:hover {
    background: #141c27; border-color: #202d3c; color: #5d6c7e;
    cursor: default; opacity: .85;
  }
  button.danger:hover { background: #4a1d24; border-color: #7a2a35; color: #ff9aa6; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1d4ed8; color: #fff; padding: 9px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { color: #7f8fa3; padding: 26px 0; text-align: center; }
  .types { display: flex; gap: 8px; margin: 0 0 16px; }
  .types button { flex: 0 0 auto; padding: 8px 16px; border-radius: 999px; }
  .types button.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>电视壁纸 · 远程导入</h1>
  <div class="sub">同一局域网下打开本页即可上传 / 切换 / 删除壁纸。上传后需要手动「设为当前」才会换画面。</div>

  <div class="types">
    <button type="button" id="tabImage" class="on">静态壁纸（图片）</button>
    <button type="button" id="tabVideo">动态壁纸（视频）</button>
  </div>

  <div class="card">
    <div class="drops">
      <div class="drop" id="drop" tabindex="0">
        <span id="dropTitle">点击选择图片，或把文件拖到这里</span><br>
        <b id="dropFormats">支持多张 JPG / PNG / WebP</b>
        <small id="dropHint">图片会直接存进电视本机，并在电视上参与 4K 静态壁纸管线</small>
      </div>
      <div class="drop" id="folderDrop" tabindex="0">
        <span id="folderTitle">点击选择文件夹，批量导入</span><br>
        <b>自动遍历子目录</b>
        <small>不保留目录结构，按文件夹为单位一次上传</small>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <input type="file" id="folder" webkitdirectory directory multiple hidden>
    <div id="progress"></div>
  </div>

  <div class="head">
    <h2 id="listTitle">已有静态壁纸</h2>
    <span id="summary">加载中…</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
  <div class="statusbar" id="statusbar"></div>
  <div class="empty" id="empty" style="display:none">还没有壁纸</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var summary = document.getElementById('summary');
  var empty = document.getElementById('empty');
  var drop = document.getElementById('drop');
  var input = document.getElementById('file');
  var folderInput = document.getElementById('folder');
  var folderDrop = document.getElementById('folderDrop');
  var prog = document.getElementById('progress');
  var pager = document.getElementById('pager');
  var statusbar = document.getElementById('statusbar');
  /* 每页数量 = 实际列数 × 窗口高度能放下的行数；列数由 CSS 决定，渲染后实测 */
  var CARD_W = 250;       // 卡片固定宽度，需与 CSS 的 .grid 列宽一致
  var MIN_GAP = 20;       // 卡片间隙最小值，需与 CSS 的 .grid gap 一致
  var cols = 9, rows = 1, PAGE_SIZE = 9, cardHeight = 0;
  var CHUNK = 24;         // 手机端触底加载每次追加的卡片数
  var shownCount = 0;     // 手机端已经渲染出来的卡片数
  var mobileItems = [];   // 手机端当前列表，便于继续追加
  var page = 0;
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var tabImage = document.getElementById('tabImage');
  var tabVideo = document.getElementById('tabVideo');
  var dropTitle = document.getElementById('dropTitle');
  var dropFormats = document.getElementById('dropFormats');
  var dropHint = document.getElementById('dropHint');
  var listTitle = document.getElementById('listTitle');
  var curType = 'image';
  var lastData = { items: [] };

  function isVideoName(name) {
    return /\.(mp4|mkv|webm|mov|m4v|ts)$/i.test(name || '');
  }

  function typeLabel(type) {
    return type === 'video' ? '动态壁纸' : '静态壁纸';
  }

  function setType(type) {
    curType = type;
    page = 0;
    shownCount = 0;
    mobileItems = [];
    var video = type === 'video';
    tabImage.className = video ? '' : 'on';
    tabVideo.className = video ? 'on' : '';
    input.accept = video ? 'video/mp4,video/x-matroska,video/webm,video/quicktime,.mp4,.mkv,.webm,.mov,.m4v' : 'image/*';
    folderInput.accept = input.accept;
    dropTitle.textContent = video ? '点击选择视频，或把文件拖到这里'
      : '点击选择图片，或把文件拖到这里';
    dropFormats.textContent = video ? '支持 MP4 / MKV / WebM / MOV，不限文件大小'
      : '支持多张 JPG / PNG / WebP';
    dropHint.textContent = video ? '视频会存进电视本机，选中后循环播放作为动态壁纸'
      : '图片会直接存进电视本机，并在电视上参与 4K 静态壁纸管线';
    listTitle.textContent = '已有' + typeLabel(type);
    render(lastData);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function fmtSize(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    if (n > 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  /** 统计/容量用：超过 1GB 就换算成 GB，避免出现 2345.6 MB */
  function fmtBytes(n) {
    if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(1) + ' GB';
    return fmtSize(n);
  }

  function api(path, opts) {
    return fetch(path, opts || {}).then(function (r) {
      return r.json().catch(function () { return { ok: false }; });
    });
  }

  /** 列间距最小 12px；把一行用剩的宽度均分进间距，让最右列贴齐右边界 */
  function applyGridGap() {
    // 用亚像素宽度，clientWidth 取整会多出半像素导致横向溢出
    var gridW = grid.getBoundingClientRect().width;
    if (!gridW) {
      return;
    }
    // 窄屏（手机）交给 media query 的流式列布局
    if (window.innerWidth <= 640) {
      grid.style.gridTemplateColumns = '';
      grid.style.columnGap = '';
      return;
    }
    var n = Math.max(1, Math.floor((gridW + MIN_GAP) / (CARD_W + MIN_GAP)));
    // 显式写死列数：auto-fill 会把变大后的 gap 也算进列宽，导致少排一列
    grid.style.gridTemplateColumns = 'repeat(' + n + ', ' + CARD_W + 'px)';
    if (n < 2) {
      grid.style.columnGap = MIN_GAP + 'px';
      return;
    }
    // 向下取整到 0.01px：总宽略小于容器，避免亚像素溢出
    var gap = Math.floor(
      (MIN_GAP + (gridW - (n * CARD_W + (n - 1) * MIN_GAP)) / (n - 1)) * 100) / 100;
    grid.style.columnGap = gap.toFixed(2) + 'px';
  }

  /** 按窗口高度计算行数，每页 = 实测列数 × 行数 */
  function computePageSize() {
    // 只按窗口高度能放下几行来算，不再扣除标题和上传区占用的高度
    var h = cardHeight || 210;
    rows = Math.max(1, Math.floor((window.innerHeight + MIN_GAP) / (h + MIN_GAP)));
    PAGE_SIZE = Math.max(1, cols * rows);
  }

  /** 读取 CSS 实际排出来的列数 */
  function measureCols() {
    var tpl = window.getComputedStyle(grid).gridTemplateColumns;
    if (!tpl || tpl === 'none') {
      return cols;
    }
    var n = tpl.split(' ').filter(function (v) { return v; }).length;
    return n > 0 ? n : cols;
  }

  var resizeTimer = null;
  var lastCompact = window.innerWidth <= 640;
  window.addEventListener('resize', function () {
    if (resizeTimer) {
      clearTimeout(resizeTimer);
    }
    // 防抖：拖拽窗口时只按最终尺寸重排一次
    resizeTimer = setTimeout(function () {
      // 跨过手机/桌面断点时重置分批进度，避免把宽屏的进度带进手机视图
      var compactNow = window.innerWidth <= 640;
      if (compactNow !== lastCompact) {
        lastCompact = compactNow;
        shownCount = 0;
        mobileItems = [];
      }
      render(lastData);
    }, 200);
  });

  function render(data) {
    lastData = data || { items: [] };
    applyGridGap();
    var all = lastData.items || [];
    var items = all.filter(function (it) {
      return (it.type === 'video' ? 'video' : 'image') === curType;
    });
    var current = curType === 'video' ? lastData.currentVideo : lastData.current;
    // 手机端不分页：一列/两列卡片本来就要滚动，分页只会多出翻页操作
    var compact = window.innerWidth <= 640;
    var pages = compact ? 1 : Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (page > pages - 1) page = pages - 1;
    if (page < 0) page = 0;
    var start = page * PAGE_SIZE;
    var pageItems = compact ? items : items.slice(start, start + PAGE_SIZE);
    summary.textContent = items.length + (curType === 'video' ? ' 个视频' : ' 张') +
      (pages > 1 ? ' · 第 ' + (page + 1) + '/' + pages + ' 页' : '') +
      (current ? ' · 当前：' + current : '');
    empty.textContent = curType === 'video' ? '还没有动态壁纸' : '还没有静态壁纸';
    empty.style.display = items.length ? 'none' : 'block';
    grid.innerHTML = '';
    if (compact) {
      // 手机端分批渲染：先画一批，触底再追加，避免几百张卡片一次性铺满
      mobileItems = items;
      var count = Math.min(Math.max(shownCount, CHUNK), items.length);
      for (var i = 0; i < count; i++) {
        grid.appendChild(makeCard(items[i]));
      }
      shownCount = count;
    } else {
      pageItems.forEach(function (it) {
        grid.appendChild(makeCard(it));
      });
    }
    // 首次渲染后按实测的列数和卡片高度校正每页数量，保证首屏正好放满
    if (grid.firstElementChild) {
      var measuredCols = measureCols();
      var measuredH = Math.round(grid.firstElementChild.getBoundingClientRect().height);
      var colsChanged = measuredCols !== cols;
      var heightChanged = measuredH > 40 && Math.abs(measuredH - cardHeight) > 4;
      if (colsChanged || heightChanged) {
        cols = measuredCols;
        if (measuredH > 40) {
          cardHeight = measuredH;
        }
        computePageSize();
        render(lastData);
        return;
      }
    }
    renderPager(pages);
    renderStatus(lastData);
    if (compact) {
      fillViewport();
    }
  }

  /** 生成单张壁纸卡片 */
  function makeCard(it) {
    var card = document.createElement('div');
    card.className = 'item' + (it.current ? ' cur' : '');

    var img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    var tq = '&type=' + curType;
    img.src = '/api/thumb?name=' + encodeURIComponent(it.name) + tq;

    // 文件名浮在缩略图底部，和电视端壁纸管理页一致
    var thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumbWrap';
    thumbWrap.appendChild(img);

    var meta = document.createElement('div');
    meta.className = 'meta';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = it.name;
    if (it.current) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '当前';
      name.appendChild(badge);
    }
    // 大小信息跟在文件名下面，一起浮在图片上
    var size = document.createElement('div');
    size.className = 'size';
    size.textContent = fmtSize(it.size) + (curType === 'video' ? ' · 循环播放' : '');

    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.appendChild(name);
    cap.appendChild(size);
    thumbWrap.appendChild(cap);
    card.appendChild(thumbWrap);

    var ops = document.createElement('div');
    ops.className = 'ops';

    var applyBtn = document.createElement('button');
    applyBtn.className = it.current ? 'ghost' : 'primary';
    applyBtn.textContent = it.current ? '当前壁纸' : '设为当前';
    applyBtn.disabled = it.current;
    if (it.current) {
      applyBtn.title = '已经是当前壁纸';
    }
    applyBtn.onclick = function () {
      applyBtn.disabled = true;
      api('/api/apply?name=' + encodeURIComponent(it.name) + tq, { method: 'POST' })
        .then(function (r) {
          if (r.ok) { toast('已切换为 ' + it.name); refresh(); }
          else { toast('切换失败'); applyBtn.disabled = false; }
        });
    };
    ops.appendChild(applyBtn);

    var delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '删除';
    delBtn.onclick = function () {
      var msg = '删除' + typeLabel(curType) + '「' + it.name + '」？';
      if (it.current) msg = '这是当前壁纸，删除后桌面会置黑，直到重新设置壁纸，继续？';
      if (!confirm(msg)) return;
      delBtn.disabled = true;
      api('/api/delete?name=' + encodeURIComponent(it.name) + tq, { method: 'POST' })
        .then(function (r) {
          if (r.ok) { toast('已删除'); refresh(); }
          else { toast(r.error || '删除失败'); delBtn.disabled = false; }
        });
    };
    ops.appendChild(delBtn);

    meta.appendChild(ops);
    card.appendChild(meta);
    return card;
  }

  /** 文档底部还剩不到这么多像素时，就该追加下一批卡片 */
  function nearBottom() {
    var doc = document.documentElement;
    var scrollTop = window.pageYOffset || doc.scrollTop || 0;
    return doc.scrollHeight - (window.innerHeight + scrollTop) < 400;
  }

  /** 追加一批卡片（手机端触底加载的最小单位） */
  function appendNextChunk() {
    var next = mobileItems.slice(shownCount, shownCount + CHUNK);
    shownCount += next.length;
    next.forEach(function (it) {
      grid.appendChild(makeCard(it));
    });
  }

  /** 首屏没被卡片填满时继续追加，避免底部留白还要等滚动 */
  function fillViewport() {
    var guard = 0;
    while (shownCount < mobileItems.length && guard++ < 20 && nearBottom()) {
      appendNextChunk();
    }
  }

  var scrollTick = false;
  window.addEventListener('scroll', function () {
    if (scrollTick || window.innerWidth > 640) {
      return;
    }
    scrollTick = true;
    window.requestAnimationFrame(function () {
      scrollTick = false;
      if (window.innerWidth <= 640 && shownCount < mobileItems.length && nearBottom()) {
        appendNextChunk();
      }
    });
  }, { passive: true });

  function renderPager(pages) {
    pager.innerHTML = '';
    if (pages <= 1) return;
    function go(target) {
      page = Math.max(0, Math.min(pages - 1, target));
      render(lastData);
      document.getElementById('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function makeBtn(label, target) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      if (target === page) {
        btn.className = 'on';
        btn.disabled = true;
      } else if (target < 0 || target >= pages) {
        btn.disabled = true;
      } else {
        btn.onclick = function () { go(target); };
      }
      return btn;
    }
    pager.appendChild(makeBtn('上一页', page - 1));
    // 页码窗口：首页、末页 + 当前页前后各一页，中间用 … 省略
    var shown = [];
    for (var i = 0; i < pages; i++) {
      if (i === 0 || i === pages - 1 || Math.abs(i - page) <= 1) {
        shown.push(i);
      }
    }
    var prev = -2;
    shown.forEach(function (i) {
      if (i - prev > 1) {
        var dots = document.createElement('span');
        dots.className = 'pinfo';
        dots.textContent = '…';
        pager.appendChild(dots);
      }
      pager.appendChild(makeBtn(String(i + 1), i));
      prev = i;
    });
    pager.appendChild(makeBtn('下一页', page + 1));
  }

  /** 分页器下方的状态栏：两类壁纸的数量/体积、当前壁纸、电视存储空间 */
  function renderStatus(data) {
    var items = data.items || [];
    var imgCount = 0, imgBytes = 0, vidCount = 0, vidBytes = 0;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.type === 'video') {
        vidCount++;
        vidBytes += it.size || 0;
      } else {
        imgCount++;
        imgBytes += it.size || 0;
      }
    }
    // 当前实际显示的壁纸：动态优先（两种模式互斥，video 有值就说明正在播视频）
    var curName = data.currentVideo || data.current;
    var curSize = null;
    for (var j = 0; j < items.length; j++) {
      if (items[j].name === curName) {
        curSize = items[j].size;
        break;
      }
    }
    var parts = [
      { k: '静态壁纸', v: imgCount + ' 张 · ' + fmtBytes(imgBytes) },
      { k: '动态壁纸', v: vidCount + ' 个 · ' + fmtBytes(vidBytes) },
      { k: '当前壁纸', v: curName ? (curName + (curSize != null ? ' · ' + fmtBytes(curSize) : ''))
                              : '无壁纸（黑屏）' }
    ];
    var st = data.storage;
    if (st && st.total > 0) {
      var usedPct = Math.round((st.total - st.available) / st.total * 100);
      parts.push({
        k: '存储',
        v: '可用 ' + fmtBytes(st.available) + ' / 共 ' + fmtBytes(st.total)
          + '（已用 ' + usedPct + '%）'
      });
    }
    statusbar.innerHTML = '';
    parts.forEach(function (p) {
      var span = document.createElement('span');
      var label = document.createElement('em');
      label.textContent = p.k;
      var value = document.createElement('b');
      value.textContent = p.v;
      span.appendChild(label);
      span.appendChild(value);
      statusbar.appendChild(span);
    });
  }

  /** 列表签名：数量 + 每项 name/size/mtime/current，用于跳过无变化的重复渲染 */
  function listSig(d) {
    var items = d.items || [];
    var sig = items.length + '|' + (d.current || '') + '|' + (d.currentVideo || '')
      // 可用空间按 64MB 取整参与比较：小幅波动不触发整列表重建
      + '|' + (d.storage ? Math.round(d.storage.available / (64 * 1024 * 1024)) : '');
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      sig += '|' + it.name + ',' + it.size + ',' + it.mtime + ',' + (it.current ? 1 : 0);
    }
    return sig;
  }

  var lastSig = '', lastFailed = false;

  function refresh() {
    api('/api/list').then(function (d) {
      // 数据没变就不重建 DOM：手机端几十上百张卡片重建一次很贵
      var sig = listSig(d || {});
      if (sig === lastSig && !lastFailed) {
        return;
      }
      lastSig = sig;
      lastFailed = false;
      render(d);
    }).catch(function () {
      lastFailed = true;
      summary.textContent = '连接断开';
    });
  }

  function uploadOne(file, index, total, host) {
    return new Promise(function (resolve) {
      var row = document.createElement('div');
      row.className = 'prow';
      var label = document.createElement('div');
      label.className = 'pname';
      label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · 0%';
      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      bar.appendChild(fill);
      row.appendChild(label);
      row.appendChild(bar);
      host.appendChild(row);
      host.scrollTop = host.scrollHeight;

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name)
        + '&type=' + curType);
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round(e.loaded / e.total * 100);
        label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · ' + pct + '%';
        fill.style.width = pct + '%';
      };
      xhr.onload = function () {
        var ok = false, msg = '上传失败', dup = false;
        try {
          var r = JSON.parse(xhr.responseText);
          ok = !!r.ok;
          dup = !!r.duplicate;
          if (ok) msg = dup ? '已存在，已忽略' : '已上传 ' + r.name;
          else msg = r.error || msg;
        } catch (e) { }
        label.textContent = (ok ? (dup ? '= ' : '✓ ') : '✗ ') + file.name
          + (dup ? ' · ' + msg : (ok ? '' : ' · ' + msg));
        fill.style.width = '100%';
        fill.style.background = ok ? '#22c55e' : '#ef4444';
        resolve(dup ? 'dup' : (ok ? 'ok' : 'fail'));
      };
      xhr.onerror = function () {
        label.textContent = '✗ ' + file.name + ' · 网络错误';
        fill.style.background = '#ef4444';
        resolve('fail');
      };
      xhr.send(file);
    });
  }

  function uploadFiles(files) {
    var video = curType === 'video';
    var list = Array.prototype.filter.call(files, function (f) {
      if (video) {
        return /^video\//.test(f.type) || isVideoName(f.name);
      }
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name || '');
    });
    if (!list.length) { toast(video ? '请选择视频文件' : '请选择图片文件'); return; }
    prog.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'phead';
    var listEl = document.createElement('div');
    listEl.className = 'plist';
    prog.appendChild(head);
    prog.appendChild(listEl);
    prog.style.display = 'block';
    var okCount = 0, dupCount = 0, failCount = 0, doneCount = 0;
    var total = list.length;
    function summaryText(done) {
      var s = '导入中 ' + done + '/' + total + ' · 成功 ' + okCount;
      if (dupCount) s += ' · 已存在 ' + dupCount;
      if (failCount) s += ' · 失败 ' + failCount;
      return s;
    }
    head.textContent = summaryText(0);
    var chain = Promise.resolve();
    list.forEach(function (f, i) {
      chain = chain.then(function () {
        return uploadOne(f, i, total, listEl).then(function (st) {
          if (st === 'ok') okCount++;
          else if (st === 'dup') dupCount++;
          else failCount++;
          doneCount++;
          head.textContent = summaryText(doneCount);
        });
      });
    });
    chain.then(function () {
      var msg = '完成：导入 ' + okCount + ' 个';
      if (dupCount) msg += '，已存在忽略 ' + dupCount + ' 个';
      if (failCount) msg += '，失败 ' + failCount + ' 个';
      head.textContent = msg;
      toast(msg);
      setTimeout(function () { prog.innerHTML = ''; prog.style.display = 'none'; }, 4000);
      refresh();
    });
  }

  drop.addEventListener('click', function () { input.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', function () {
    if (input.files && input.files.length) uploadFiles(input.files);
    input.value = '';
  });
  folderDrop.addEventListener('click', function () { folderInput.click(); });
  folderDrop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); folderInput.click(); }
  });
  folderInput.addEventListener('change', function () {
    if (folderInput.files && folderInput.files.length) uploadFiles(folderInput.files);
    folderInput.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('hover'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('hover'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });

  tabImage.addEventListener('click', function () { setType('image'); });
  tabVideo.addEventListener('click', function () { setType('video'); });
  computePageSize();
  setType('image');
  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
