<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电视壁纸 · 远程导入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    background: #0b1017; color: #e8eef6;
    font: 15px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #8fa0b3; font-size: 13px; margin-bottom: 22px; }
  .card { background: #131b26; border: 1px solid #1e2a3a; border-radius: 14px; padding: 18px; }
  .drop {
    border: 2px dashed #2d4059; border-radius: 14px; padding: 30px 20px;
    text-align: center; cursor: pointer; transition: .15s;
  }
  .drop.hover, .drop:focus { border-color: #4c8dff; background: #14202f; outline: none; }
  .drop b { color: #4c8dff; }
  .drop small { display: block; color: #7f8fa3; margin-top: 6px; }
  #progress { margin-top: 14px; display: none; }
  .prow { margin-top: 8px; font-size: 13px; color: #a8b8c9; }
  .bar { height: 6px; background: #1b2735; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: #4c8dff; transition: width .15s; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
  .head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .head span { color: #7f8fa3; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .item { background: #131b26; border: 1px solid #1e2a3a; border-radius: 12px; overflow: hidden; }
  .item.cur { border-color: #4c8dff; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #0f1620; }
  .meta { padding: 10px 12px 12px; }
  .name { font-size: 13px; word-break: break-all; color: #dbe6f2; }
  .size { font-size: 12px; color: #7f8fa3; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #1d4ed8; color: #fff; margin-left: 6px; }
  .ops { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid #2b3a4d; background: #1a2533; color: #dbe6f2; cursor: pointer;
  }
  button:hover { background: #223044; }
  button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  button:disabled, button:disabled:hover {
    background: #141c27; border-color: #202d3c; color: #5d6c7e;
    cursor: default; opacity: .85;
  }
  button.danger:hover { background: #4a1d24; border-color: #7a2a35; color: #ff9aa6; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1d4ed8; color: #fff; padding: 9px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .empty { color: #7f8fa3; padding: 26px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>电视壁纸 · 远程导入</h1>
  <div class="sub">同一局域网下打开本页即可上传 / 切换 / 删除壁纸。上传后需要手动「设为当前」才会换画面。</div>

  <div class="card">
    <div class="drop" id="drop" tabindex="0">
      点击选择图片，或把文件拖到这里<br>
      <b>支持多张 JPG / PNG / WebP</b>
      <small>图片会直接存进电视本机，并在电视上参与 4K 静态壁纸管线</small>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div id="progress"></div>
  </div>

  <div class="head">
    <h2>已有壁纸</h2>
    <span id="summary">加载中…</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">还没有壁纸</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var summary = document.getElementById('summary');
  var empty = document.getElementById('empty');
  var drop = document.getElementById('drop');
  var input = document.getElementById('file');
  var prog = document.getElementById('progress');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function fmtSize(n) {
    if (n > 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
    if (n > 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  function api(path, opts) {
    return fetch(path, opts || {}).then(function (r) {
      return r.json().catch(function () { return { ok: false }; });
    });
  }

  function render(data) {
    var items = (data && data.items) || [];
    summary.textContent = items.length + ' 张' +
      (data && data.current ? ' · 当前：' + data.current : '');
    empty.style.display = items.length ? 'none' : 'block';
    grid.innerHTML = '';
    items.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'item' + (it.current ? ' cur' : '');

      var img = document.createElement('img');
      img.className = 'thumb';
      img.loading = 'lazy';
      img.src = '/api/thumb?name=' + encodeURIComponent(it.name);
      card.appendChild(img);

      var meta = document.createElement('div');
      meta.className = 'meta';

      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = it.name;
      if (it.current) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '当前';
        name.appendChild(badge);
      }
      meta.appendChild(name);

      var size = document.createElement('div');
      size.className = 'size';
      size.textContent = fmtSize(it.size);
      meta.appendChild(size);

      var ops = document.createElement('div');
      ops.className = 'ops';

      var applyBtn = document.createElement('button');
      applyBtn.className = it.current ? 'ghost' : 'primary';
      applyBtn.textContent = it.current ? '当前壁纸' : '设为当前';
      applyBtn.disabled = it.current;
      if (it.current) {
        applyBtn.title = '已经是当前壁纸';
      }
      applyBtn.onclick = function () {
        applyBtn.disabled = true;
        api('/api/apply?name=' + encodeURIComponent(it.name), { method: 'POST' })
          .then(function (r) {
            if (r.ok) { toast('已切换为 ' + it.name); refresh(); }
            else { toast('切换失败'); applyBtn.disabled = false; }
          });
      };
      ops.appendChild(applyBtn);

      var delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = '删除';
      delBtn.onclick = function () {
        if (!confirm('删除壁纸「' + it.name + '」？')) return;
        delBtn.disabled = true;
        api('/api/delete?name=' + encodeURIComponent(it.name), { method: 'POST' })
          .then(function (r) {
            if (r.ok) { toast('已删除'); refresh(); }
            else { toast('删除失败（可能是当前壁纸）'); delBtn.disabled = false; }
          });
      };
      ops.appendChild(delBtn);

      meta.appendChild(ops);
      card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  function refresh() {
    api('/api/list').then(render).catch(function () {
      summary.textContent = '连接断开';
    });
  }

  function uploadOne(file, index, total) {
    return new Promise(function (resolve) {
      var row = document.createElement('div');
      row.className = 'prow';
      var label = document.createElement('div');
      label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · 0%';
      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      bar.appendChild(fill);
      row.appendChild(label);
      row.appendChild(bar);
      prog.appendChild(row);
      prog.style.display = 'block';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round(e.loaded / e.total * 100);
        label.textContent = '(' + (index + 1) + '/' + total + ') ' + file.name + ' · ' + pct + '%';
        fill.style.width = pct + '%';
      };
      xhr.onload = function () {
        var ok = false, msg = '上传失败';
        try {
          var r = JSON.parse(xhr.responseText);
          ok = !!r.ok;
          if (ok) msg = '已上传 ' + r.name;
          else msg = r.error || msg;
        } catch (e) { }
        label.textContent = (ok ? '✓ ' : '✗ ') + file.name + (ok ? '' : ' · ' + msg);
        fill.style.width = '100%';
        fill.style.background = ok ? '#22c55e' : '#ef4444';
        resolve(ok);
      };
      xhr.onerror = function () {
        label.textContent = '✗ ' + file.name + ' · 网络错误';
        fill.style.background = '#ef4444';
        resolve(false);
      };
      xhr.send(file);
    });
  }

  function uploadFiles(files) {
    var list = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type); });
    if (!list.length) { toast('请选择图片文件'); return; }
    var okCount = 0;
    var chain = Promise.resolve();
    list.forEach(function (f, i) {
      chain = chain.then(function () {
        return uploadOne(f, i, list.length).then(function (ok) { if (ok) okCount++; });
      });
    });
    chain.then(function () {
      toast('完成：成功 ' + okCount + ' / ' + list.length);
      setTimeout(function () { prog.innerHTML = ''; prog.style.display = 'none'; }, 2500);
      refresh();
    });
  }

  drop.addEventListener('click', function () { input.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', function () {
    if (input.files && input.files.length) uploadFiles(input.files);
    input.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('hover'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('hover'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });

  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
